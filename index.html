
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Fahad">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <link href= "css/style.css" rel= "stylesheet" type="text/css"/> 
  <title>add loot simulator</title>
</head>

<body>

    <h1>add loot with values</h1>
    <fieldset>
        <legend>press the button when your done adding</legend>

        <label for="lootname">loot:</label>
        <input type="text" id="lootname" name="lootname"
               placeholder="yoour loot" required>
        <br><br>

        <label for="lootnumber">value:</label>
        <input type="lootnumber" id="lootnumber" name="lootnumber">
        <br><br>

        <button type="button" id="activateButton">add loot</button>


        <p id="validation message"></p>
        <h2>loot collected</h2>
        <div id="list"></div>
        <h2>total of loot</h2>
        <div id="total"></div>

    </fieldset>
</body>
<script type="text/javascript" src="js/loot.js"></script>
</html>
